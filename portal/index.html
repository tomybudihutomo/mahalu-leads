<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mahalu App</title>
  <meta name="theme-color" content="#f5f0e9" />
  <style>
    :root{--bg:#f5f0e9;--card:#fffdf9;--text:#342d29;--muted:#746a63;--accent:#966344;--line:#e5d6ca;--shadow:0 18px 50px rgba(62,43,32,.10)}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#fffaf4 0,var(--bg) 50%,#efe6dc 100%);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px}
    .wrap{width:min(720px,100%)}
    .head{text-align:center;margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:800}.head h1{font-family:Georgia,serif;font-size:42px;margin:8px 0 8px}.head p{margin:0;color:var(--muted);font-size:15px}
    .panel{background:rgba(255,253,249,.94);border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
    .grid{display:grid;gap:14px}
    .app{display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;border:1px solid var(--line);background:#fff;border-radius:18px;padding:18px 18px;transition:.18s ease;min-height:88px}
    .app:hover{transform:translateY(-2px);border-color:#caa98f;box-shadow:0 10px 28px rgba(90,57,38,.10)}
    .icon{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:#f3e7dd;color:var(--accent);font-size:24px;flex:0 0 auto}
    .copy{min-width:0;flex:1}.copy strong{font-size:17px;display:block;margin-bottom:4px}.copy span{color:var(--muted);font-size:13px;line-height:1.45}.arrow{font-size:22px;color:#a48876}
    .foot{text-align:center;color:#9a8d83;font-size:12px;margin-top:18px}
    @media(max-width:520px){.head h1{font-size:34px}.panel{padding:14px;border-radius:22px}.app{padding:15px}.icon{width:46px;height:46px}.copy strong{font-size:16px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="head">
      <div class="eyebrow">Mahalu Spa</div>
      <h1>Mahalu App</h1>
      <p>Pusat akses tools internal Mahalu Spa</p>
    </header>

    <section class="panel">
      <div class="grid">
        <a class="app" href="https://mahalu-hpp-produk.vercel.app" aria-label="Buka HPP">
          <div class="icon">₿</div>
          <div class="copy"><strong>HPP</strong><span>Produk, bahan, dan perhitungan biaya layanan</span></div>
          <div class="arrow">›</div>
        </a>

        <a class="app" href="https://mahalu-spa-checklist.vercel.app" aria-label="Buka Checklist SOP">
          <div class="icon">✓</div>
          <div class="copy"><strong>Checklist Operasional</strong><span>Opening, closing, dan kontrol SOP harian</span></div>
          <div class="arrow">›</div>
        </a>

        <a class="app" href="https://mahalu-leads-tomybudihutomo-4239s-projects.vercel.app" aria-label="Buka CRM Leads">
          <div class="icon">◎</div>
          <div class="copy"><strong>CRM Leads</strong><span>Leads, follow-up, deal, lost reason, dan performa iklan</span></div>
          <div class="arrow">›</div>
        </a>
      </div>
    </section>

    <div class="foot">Internal Tools • Mahalu Spa</div>
  </main>
</body>
</html>
